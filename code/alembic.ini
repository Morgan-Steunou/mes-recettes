# Migrations de la base de données (Alembic).
# Elles sont appliquées automatiquement au démarrage de l'API (init_db), sauf avec
# RUN_MIGRATIONS_ON_STARTUP=false ; en production : python -m app.cli migrate.
# À la main, depuis code/ :
#   alembic upgrade head                          appliquer les migrations
#   alembic revision --autogenerate -m "..."      créer une migration d'après les modèles
# La connexion est lue dans la configuration de l'application (.env), pas ici.

[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
# Séparateur des listes de chemins ci-dessus : celui du système (« ; » sous Windows, « : » ailleurs)
path_separator = os
